name: Build & Notify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Locate APK and rename
        id: apk
        run: |
          set -e
          SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          DEST="GalleryApp-build${{ github.run_number }}-${GITHUB_SHA::7}.apk"
          cp "$SRC" "$DEST"
          SIZE=$(du -h "$DEST" | cut -f1)
          echo "path=$DEST"  >> "$GITHUB_OUTPUT"
          echo "name=$DEST"  >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"  >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create release with APK attached
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            Auto-generated build from `${{ github.ref_name }}` @ ${{ github.sha }}.

            Triggered by @${{ github.actor }}.
            Commit message: ${{ github.event.head_commit.message }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
          prerelease: true

      - name: Notify Slack (success)
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::SLACK_WEBHOOK_URL not set"; exit 0
          fi
          SHORT_SHA="${COMMIT_SHA:0:7}"
          PAYLOAD=$(jq -n \
            --arg apk        "$APK_NAME" \
            --arg size       "$APK_SIZE" \
            --arg url        "$RELEASE_URL" \
            --arg sha        "$SHORT_SHA" \
            --arg msg        "$COMMIT_MSG" \
            --arg actor      "$ACTOR" \
            --arg branch     "$BRANCH" \
            --arg repo       "$REPO" \
            --arg run_number "$RUN_NUMBER" \
            '{
              text: (":white_check_mark: GalleryApp build #" + $run_number + " ready"),
              blocks: [
                { type: "header", text: { type: "plain_text", text: (":white_check_mark: GalleryApp build #" + $run_number + " ready") } },
                { type: "section", fields: [
                    { type: "mrkdwn", text: ("*APK*\n" + $apk + " (" + $size + ")") },
                    { type: "mrkdwn", text: ("*Branch*\n`" + $branch + "`") },
                    { type: "mrkdwn", text: ("*Commit*\n<https://github.com/" + $repo + "/commit/" + $sha + "|" + $sha + ">") },
                    { type: "mrkdwn", text: ("*Author*\n@" + $actor) }
                ]},
                { type: "section", text: { type: "mrkdwn", text: ("*Message*\n" + $msg) } },
                { type: "actions", elements: [
                    { type: "button", style: "primary", text: { type: "plain_text", text: "Download APK" }, url: $url }
                ]}
              ]
            }')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$WEBHOOK"

      - name: Notify Slack (failure)
        if: failure()
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$WEBHOOK" ]; then exit 0; fi
          SHORT_SHA="${COMMIT_SHA:0:7}"
          PAYLOAD=$(jq -n \
            --arg repo   "$REPO" \
            --arg run_id "$RUN_ID" \
            --arg branch "$BRANCH" \
            --arg sha    "$SHORT_SHA" \
            '{
              text: (":x: GalleryApp build failed on " + $branch + " (" + $sha + ")"),
              blocks: [
                { type: "section", text: { type: "mrkdwn",
                  text: (":x: *GalleryApp build failed* on `" + $branch + "` @ " + $sha + "\n<https://github.com/" + $repo + "/actions/runs/" + $run_id + "|View logs>") } }
              ]
            }')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$WEBHOOK" || true

